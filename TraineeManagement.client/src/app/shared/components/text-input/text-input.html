<div class="field">
  <label [for]="id">{{ label }}</label>

  <input
    [id]="id"
    [name]="name"
    [type]="type"
    [placeholder]="placeholder"
    [autocomplete]="autocomplete"
    [required]="required"
    [value]="displayValue"
    [disabled]="disabled"
    (input)="onInput($event)"
    (blur)="onBlur()"
    [attr.aria-invalid]="error ? true : null"
    [attr.aria-describedby]="error ? id + '-error' : null"
  />

  <div
    class="field-error"
    [class.hidden]="!error"
    [id]="id + '-error'"
  >
    {{ error || 'No error' }}
  </div>
</div>
